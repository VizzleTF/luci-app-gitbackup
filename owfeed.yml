# How gitbackup's .apk is actually built -- see https://github.com/owfeed/owfeed
#
#   ./tools/stage.sh     # produce dist/root, the tree owfeed packages
#   owfeed build         # dist/noarch/gitbackup-<version>.apk
#
# Why this replaced the SDK (ticket 01 review): gitbackup is noarch -- POSIX shell, UCI
# text and JSON, not one compiled byte -- and an SDK build under x86_64 emulation ran
# past forty minutes to perform what amounts to a `cp` before it was stopped. What the
# SDK contributed was three things owfeed also does: the .lmo translation catalogues
# (unused here -- gitbackup ships none of its own, see applications/luci-app-gitbackup
# for those, a later ticket), the conffiles/scripts sidecars package-pack.mk emits, and
# -- critical for this package -- the default_postinst wrapper, without which
# /etc/uci-defaults/99-gitbackup would never run at all (verified on the owlab stand).
#
# The SDK verification did not go away with it: owfeed fetches the host `apk` out of a
# release SDK and holds it to the same ed25519 signature over sha256sums, with the key
# pinned from another host.
#
# package/gitbackup/Makefile stays, and is not a second source of truth for anything
# declared here (name, version, depends, conffiles): it is still how anyone can build
# this package in a real SDK. It IS the source of truth for lifecycle scripts --
# tools/stage.sh reads postinst/prerm out of it, the same way luci-theme-footstrap's
# does -- but gitbackup currently defines neither there (see tools/stage.sh for why), so
# nothing is extracted today and no `scripts:` block appears below.
version: 1

feed:
  name: gitbackup
  # This repository publishes RELEASE ASSETS, not a feed of its own. An installed apk key
  # is a trust anchor for every package NAME, not just ours -- more authority than one
  # package should ask a router for. The feed that carries these packages is
  # owfeed-packages: it pins our released artifacts by the signed manifest and signs its
  # own index, so `build` (plus `sign`/`release` in the release job) is the whole of what
  # this file drives. `owfeed publish` is never run from here.
  #
  # The url is the feed our packages are installed FROM, and it is what
  # `owfeed install-snippet` prints -- bootstrap.sh takes the same address from the same
  # place, because two answers to "where is the feed" is exactly the defect that shipped
  # once already (D13: bootstrap wrote a repositories.d line GitHub cannot serve).
  url: https://repo.owfeed.org
  title: gitbackup
  maintainer: "VizzleTF <vizzlef@gmail.com>"
  license: GPL-2.0-only
  homepage: https://github.com/VizzleTF/luci-app-gitbackup

# 25.12 and later only, and the line is stated rather than defaulted. This package needs
# apk: /etc/apk/repositories.d, `apk add` by name and the default_postinst wrapper that
# makes /etc/uci-defaults/99-gitbackup run are all 25.12-era, and nothing here has been
# built or tested against opkg on 24.10.
releases:
  - line: "25.12"
    default: true
    format: apk

# NO `signing:` block, and the absence is deliberate: those keys sign a feed's INDEX, and
# this repository never builds one. What vouches for these bytes is the EC signature
# `owfeed sign` puts INSIDE each .apk (the author key, pinned by the carrying feed under
# keys/luci-app-gitbackup.pub.pem) plus the usign signature `owfeed release` writes over
# manifest.txt -- both made in the release job, on a tag, where the secrets are reachable
# and no pull-request job is.

# Required by the schema and unused here: `publish` hands a built feed to a host, and this
# repository stops after `build`.
publish:
  - target: github-pages

packages:
  - name: gitbackup
    build: mkpkg
    # Never "all" -- apk rejects it. Matches package/gitbackup/Makefile's PKGARCH:=all,
    # which is package-pack.mk's spelling of the same fact for an SDK build.
    arch: noarch
    version-from: file:./dist/VERSION
    files: ./dist/root
    description: "Automatic configuration backup to a Git repository"
    # Exactly package/gitbackup/Makefile's DEPENDS, each entry earned by a measured
    # 25.12.4 failure (see the Makefile's own comment): the `+` is package.mk syntax
    # for "select by default", which has no owfeed equivalent and no meaning here.
    depends: [git, git-http, ca-bundle, jsonfilter, coreutils-stat, openssh-client, openssh-keygen]
    license: GPL-2.0-only
    url: https://github.com/VizzleTF/luci-app-gitbackup
    maintainer: "VizzleTF <vizzlef@gmail.com>"
    # /etc/config/gitbackup must survive a package upgrade untouched -- an unnamed
    # conffile is an ordinary file to apk, replaced on every upgrade with the package
    # default, wiping the user's configuration.
    conffiles: ["/etc/config/gitbackup"]
    # Which commit produced these bytes, recorded in the package itself.
    repo-commit: env:GITHUB_SHA

  # The second of the two noarch packages the spec names ("Упаковка"): client-side
  # JS only (menu.d/acl.d JSON plus the four view/*.js files under htdocs/), same
  # "not one compiled byte" reasoning as gitbackup's own arch: noarch above. Staged
  # by the same tools/stage.sh into ./dist/luci-root (root/ plus htdocs/ merged at
  # /www, mirroring this project's own owlab.yaml install: mapping for the dev stand).
  #
  - name: luci-app-gitbackup
    build: mkpkg
    arch: noarch
    version-from: file:./dist/LUCI_VERSION
    files: ./dist/luci-root
    description: "Automatic configuration backup to a Git repository (LuCI)"
    # Matches applications/luci-app-gitbackup/Makefile's LUCI_DEPENDS:=+gitbackup --
    # the "+" is package.mk syntax for "select by default", no owfeed equivalent.
    depends: [gitbackup]
    license: GPL-2.0-only
    url: https://github.com/VizzleTF/luci-app-gitbackup
    maintainer: "VizzleTF <vizzlef@gmail.com>"

  # Translation, as its own package -- same shape luci-theme-footstrap's owfeed.yml
  # uses for luci-i18n-footstrap-<lang> (luci.mk's own naming: luci-i18n-<basename>-
  # <lang>, one package per language). applications/luci-app-gitbackup/po/ru/
  # gitbackup.po exists and is complete (i18n-check.sh's msgcmp gate is green); the
  # only language shipped so far is ru, hence one package, not a loop.
  #
  # i18n.from points straight at the committed po/ tree, not a staged copy: owfeed's
  # compiler globs <from>/*/*.po, so po/templates/gitbackup.pot (a .pot, not .po) is
  # skipped by the extension alone and po/ needs no ticket-15-style staging step of
  # its own. basename is spelled out rather than left to the .po filename's default
  # (which already resolves to the same "gitbackup") for the reason footstrap's own
  # owfeed.yml gives: a renamed .po must not silently rename the shipped .lmo under
  # it.
  #
  # `files:` still has to point at a real staged directory -- owfeed rejects a mkpkg
  # package with no files: at all -- and that directory (dist/i18n-ru, built by
  # tools/stage.sh) carries exactly one thing: the uci-defaults line luci.mk's own
  # Package/luci-i18n-$(LUCI_BASENAME)-$(1)/install emits, `uci set
  # luci.languages.ru=...`. Without it the .lmo is on disk but LuCI's own Language
  # dropdown (luci-mod-system's system.js: `Object.assign({en:'English'},
  # uci.get('luci','languages'))`) never lists Russian as a choice -- confirmed
  # against the openwrt/luci checkout, not assumed.
  - name: luci-i18n-gitbackup-ru
    build: mkpkg
    arch: noarch
    version-from: file:./dist/LUCI_VERSION
    files: ./dist/i18n-ru
    description: "Automatic configuration backup to a Git repository (LuCI) - Russian translation"
    depends: [luci-app-gitbackup]
    license: GPL-2.0-only
    url: https://github.com/VizzleTF/luci-app-gitbackup
    maintainer: "VizzleTF <vizzlef@gmail.com>"
    i18n:
      from: ./applications/luci-app-gitbackup/po
      basename: gitbackup
    # Two entries, one pinned with `=`, per owfeed's own requirement -- this is what
    # re-fires the rule on every luci-app-gitbackup upgrade. luci-i18n-base-ru is
    # what "this router already reads Russian" looks like to apk (it cannot read
    # `uci luci.main.lang` itself); a router without it installed still gets this
    # package by explicit `apk add luci-i18n-gitbackup-ru`, install-if only governs
    # the automatic pull.
    install-if: [ "luci-app-gitbackup={version}", "luci-i18n-base-ru" ]
